services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mail_db
      POSTGRES_USER: mail_user
      POSTGRES_PASSWORD: TuZlSxfliKNet0jaGKvEsOpqozcIzP6gzM7Fg1PNdJA
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mail_user -d mail_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
