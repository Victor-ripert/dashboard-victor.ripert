services:
  trading-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://trading:${POSTGRES_PASSWORD}@postgres:5432/trading
      ALPACA_CLIENT_ID: ${ALPACA_CLIENT_ID}
      ALPACA_CLIENT_SECRET: ${ALPACA_CLIENT_SECRET}
      ALPACA_REDIRECT_URI: ${ALPACA_REDIRECT_URI}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      INTERNAL_JWT_ISSUER: ${INTERNAL_JWT_ISSUER}
      INTERNAL_JWT_AUDIENCE: ${INTERNAL_JWT_AUDIENCE}
    ports:
      - "8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: trading-service-postgres
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - trading_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  trading_postgres_data: